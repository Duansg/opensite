name: Check, build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opensite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://opensite.pages.dev' }}
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: node --version
      - run: npm ci
      - run: npm run format:check
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: opensite-static
          path: dist/
          retention-days: 7
          include-hidden-files: true
      - name: Report deployment setup
        if: ${{ vars.CLOUDFLARE_DEPLOY_TARGET == '' }}
        run: echo 'Build verified. Connect Cloudflare Pages to this repository for native automatic deployments, or configure CLOUDFLARE_DEPLOY_TARGET for Actions deployment. See DEPLOYMENT.md.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: verify
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      (vars.CLOUDFLARE_DEPLOY_TARGET == 'pages' || vars.CLOUDFLARE_DEPLOY_TARGET == 'workers')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: node --version
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: opensite-static
          path: dist/
      - name: Validate credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets. See DEPLOYMENT.md.'
            exit 1
          fi
      - name: Deploy to Pages
        if: ${{ vars.CLOUDFLARE_DEPLOY_TARGET == 'pages' }}
        run: npx wrangler pages deploy dist --project-name opensite --branch main
      - name: Deploy to Workers
        if: ${{ vars.CLOUDFLARE_DEPLOY_TARGET == 'workers' }}
        run: npx wrangler deploy --config wrangler.worker.jsonc
